<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Predera parimutuel payouts</title><desc id="d">Left: what each staker in market 0 redeems for each outcome. Right: payout per HBAR staked on YES as a function of the YES share of the pool.</desc>
<rect width="880" height="380" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="40" y="36" font-size="15" font-weight="700" fill="#1f2937">Who redeems what: 5 HBAR on YES, 3 HBAR on NO</text>
<line x1="60" x2="410" y1="100" y2="100" stroke="#e5e7eb"/>
<text x="52" y="104" font-size="11" text-anchor="end" fill="#6b7280">8</text>
<line x1="60" x2="410" y1="200" y2="200" stroke="#e5e7eb"/>
<text x="52" y="204" font-size="11" text-anchor="end" fill="#6b7280">4</text>
<line x1="60" x2="410" y1="300" y2="300" stroke="#e5e7eb"/>
<text x="52" y="304" font-size="11" text-anchor="end" fill="#6b7280">0</text>
<text x="20" y="190" font-size="11" fill="#6b7280" transform="rotate(-90 20 190)" text-anchor="middle">HBAR redeemed</text>
<rect x="80" y="100" width="36" height="200" rx="3" fill="#16a34a"/>
<text x="98" y="94" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">8</text>
<rect x="124" y="298" width="36" height="2" rx="3" fill="#dc2626"/>
<text x="142" y="292" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">0</text>
<text x="120" y="320" font-size="12" text-anchor="middle" fill="#1f2937">YES wins</text>
<rect x="195" y="298" width="36" height="2" rx="3" fill="#16a34a"/>
<text x="213" y="292" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">0</text>
<rect x="239" y="100" width="36" height="200" rx="3" fill="#dc2626"/>
<text x="257" y="94" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">8</text>
<text x="235" y="320" font-size="12" text-anchor="middle" fill="#1f2937">NO wins</text>
<rect x="310" y="175" width="36" height="125" rx="3" fill="#16a34a"/>
<text x="328" y="169" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">5</text>
<rect x="354" y="225" width="36" height="75" rx="3" fill="#dc2626"/>
<text x="372" y="219" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">3</text>
<text x="350" y="320" font-size="12" text-anchor="middle" fill="#1f2937">Void or one-sided</text>
<rect x="80" y="338" width="12" height="12" rx="2" fill="#16a34a"/><text x="98" y="349" font-size="12" fill="#1f2937">YES staker (5 tokens)</text>
<rect x="250" y="338" width="12" height="12" rx="2" fill="#dc2626"/><text x="268" y="349" font-size="12" fill="#1f2937">NO staker (3 tokens)</text>
<line x1="440" x2="440" y1="24" y2="356" stroke="#e5e7eb"/>
<text x="470" y="36" font-size="15" font-weight="700" fill="#1f2937">HBAR paid per YES token if YES wins</text>
<line x1="510" x2="840" y1="300" y2="300" stroke="#e5e7eb"/>
<text x="502" y="304" font-size="11" text-anchor="end" fill="#6b7280">0x</text>
<line x1="510" x2="840" y1="254" y2="254" stroke="#e5e7eb"/>
<text x="502" y="258" font-size="11" text-anchor="end" fill="#6b7280">1x</text>
<line x1="510" x2="840" y1="208" y2="208" stroke="#e5e7eb"/>
<text x="502" y="212" font-size="11" text-anchor="end" fill="#6b7280">2x</text>
<line x1="510" x2="840" y1="162" y2="162" stroke="#e5e7eb"/>
<text x="502" y="166" font-size="11" text-anchor="end" fill="#6b7280">3x</text>
<line x1="510" x2="840" y1="116" y2="116" stroke="#e5e7eb"/>
<text x="502" y="120" font-size="11" text-anchor="end" fill="#6b7280">4x</text>
<line x1="510" x2="840" y1="70" y2="70" stroke="#e5e7eb"/>
