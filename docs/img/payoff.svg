<text x="519.9" y="248" font-size="11" fill="#6b7280">1x: stake back</text>
<circle cx="716.25" cy="226.39999999999998" r="6" fill="#7c3aed"/>
<text x="726.25" y="214.39999999999998" font-size="12" font-weight="600" fill="#7c3aed">market 0: pays 1.6x</text>
<text x="589.2" y="88.4" font-size="12" fill="#1f2937">payout = stake x total pool / winning pool</text>
<text x="589.2" y="104.4" font-size="12" fill="#6b7280">More stake on your side later lowers your multiple.</text>
