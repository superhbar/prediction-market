name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile and test contracts
        run: |
          yarn foundry:compile
          yarn foundry:test

      - name: Lint
        run: yarn lint

      - name: Check typings on nextjs
        run: yarn next:check-types

      - name: Unit test nextjs
        run: yarn next:test

      - name: Build nextjs
        run: yarn next:build

  # Secrets anywhere in history fail the build, and so does any medium or high Slither finding that has not
  # been reviewed. Reviewed findings carry an inline slither-disable comment with the reason next to the code.
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Gitleaks over every commit
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Slither
        working-directory: packages/foundry
        run: |
          pip install --quiet slither-analyzer
          slither . --filter-paths "lib/|test/|script/" --exclude-dependencies --fail-medium

  # Rehearses the bounty eligibility gate: scaffold this commit with the real create-scaffold-hbar CLI,
  # exactly as `npm create scaffold-hbar@latest -- --template superhbar/prediction-market` would, then
  # install, lint, type-check, test and build the fresh project with each supported package manager.
  fresh-scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [yarn, npm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable corepack for Yarn
        run: corepack enable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # create-scaffold-hbar refuses to run without a git identity, because it makes the initial commit.
      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Export the committed tree like a GitHub tarball
        run: |
          mkdir -p "$RUNNER_TEMP/template"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/template"

      - name: Scaffold with create-scaffold-hbar
        working-directory: ${{ runner.temp }}
        env:
          CREATE_SCAFFOLD_HBAR_TEMPLATE_DIR: ${{ runner.temp }}/template
        run: >
          npx --yes create-scaffold-hbar@latest app
          --template superhbar/prediction-market
          --solidity-framework foundry
          --package-manager ${{ matrix.package-manager }}
          --skip-hedera-skills --ci

      - name: Gate checks
        working-directory: ${{ runner.temp }}/app
        run: |
          test ! -f template.json
          run() { if [ "${{ matrix.package-manager }}" = yarn ]; then yarn "$@"; else npm run "$@"; fi; }
          run lint
          run next:check-types
          run next:test
          run foundry:test
          run next:build

      # The gate also requires the app to boot and its core routes to answer, so serve the build that
      # the previous step produced and request each route, checking the status and the rendered app name.
      - name: Boot and request core routes
        working-directory: ${{ runner.temp }}/app/packages/nextjs
        run: |
          npx next start -p 3000 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          for route in / /markets/new /markets/0 /portfolio /debug; do
            response=$(curl -s -w '\n%{http_code}' "http://localhost:3000$route")
            status=$(tail -n1 <<<"$response")
            echo "$route -> $status"
            test "$status" = 200
            grep -q Predera <<<"$response"
          done
