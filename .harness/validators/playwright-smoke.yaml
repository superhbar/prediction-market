# Runs on 20960 rather than 3000, which is often taken on a dev machine. PORT overrides it.
name: market-activity-smoke
server:
  command: node .harness/validators/command.cjs next:dev
  url: http://localhost:20960
  timeoutMs: 180000
defaults:
  timeoutMs: 60000
  hydrationTimeoutMs: 60000
  minBodyTextLength: 40
  failOnConsoleError: true
routes:
  - name: markets
    path: /
  - name: market-detail
    path: /markets/0
  - name: create
    path: /markets/new
  - name: portfolio
    path: /portfolio
  # /debug is left out on purpose: the upstream @scaffold-hbar-ui/debug-contracts package fetches a
  # USD price from CoinGecko itself and logs a console error wherever CoinGecko is unreachable or
  # rate-limited, which is outside this template's code. The route still renders (HTTP 200).
  - name: missing-market
    path: /markets/099999
forbidden:
  visibleText:
    - Application error
    - Unhandled Runtime Error
    - Internal Server Error
    - This page could not be found
