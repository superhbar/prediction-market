schemaVersion: 2

name: market-activity
description: >
  Add a market activity panel to the market detail page. It reads the
  PredictionMarkets event logs for one market from the Hedera mirror node
  (stakes, retries, settlement, voiding, redeems, reserve withdrawal) and
  links every entry to its Hashscan transaction.

agent: claude

# Local run only: the nested Claude CLI is not logged in on this machine, so the generator is
# OpenCode through a shim and the Tier 3 semantic validator is graded by hand afterwards.
generator:
  provider: command
  command: /private/tmp/claude-501/-Users-beyond-Desktop-projects-hedera-scaffold/8ac14ac9-feff-482f-b6e1-b7320361262d/scratchpad/harness-opencode.sh
  args: ["{prompt}"]
  timeoutMs: 3500000

prd: .harness/prds/01-market-activity.md

baseline:
  commands:
    - name: install
      command: yarn install
    - name: contracts
      command: yarn foundry:test
      timeoutMs: 600000
    - name: build
      command: yarn next:build

requiredFiles:
  - packages/nextjs/components/markets/ActivityPanel.tsx

validators:
  playwright: .harness/validators/playwright-smoke.yaml

contract: .harness/acceptance-contract.json
validator:
  enabled: false

# Tier 3.5: the harness funds an ephemeral ECDSA testnet account from your
# operator and injects it as the burner wallet. The frontend already points at
# the shipped testnet deployment, so nothing is deployed. Creating a market
# costs about 33 HBAR (two HTS token creations plus the settlement reserve).
chainValidation:
  enabled: true
  network: testnet
  operator:
    accountIdEnv: HEDERA_OPERATOR_ID
    privateKeyEnv: HEDERA_OPERATOR_KEY
  fundingHbar: 50
  sweepBack: true
  expose:
    browserLocalStorageKey: burnerWallet.pk
    envVars: [DEPLOYER_PRIVATE_KEY]
